[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/moe-adapter-sdk",
  "crates/moe-core",
  "crates/moe-credential-store",
  "crates/moe-mcp",
  "crates/moe-protocol",
  "crates/moe-relay-client",
  "crates/moe-relay-transport",
  "spikes/rust-relay-pairing",
  "spikes/windows-credential-store",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
