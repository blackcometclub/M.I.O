name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check desktop
        run: npm run typecheck

      - name: Build desktop frontend
        run: npm run build

      - name: Build unsigned Windows installer
        shell: pwsh
        run: ./scripts/build-alpha-windows.ps1 -Installer

      - name: Test evidence sanitization
        run: npm run test --workspace @moe/spike-codex-app-server

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify Windows dependency boundary
        shell: pwsh
        run: |
          $packages = @(
            cargo tree --target x86_64-pc-windows-msvc --prefix none --format '{p}'
          )
          if ($LASTEXITCODE -ne 0) {
            throw "cargo tree failed with exit code $LASTEXITCODE"
          }

          $glibPackages = @($packages | Where-Object { $_ -match '^glib v' })
          if ($glibPackages.Count -gt 0) {
            throw "Windows target unexpectedly includes glib: $($glibPackages -join ', ')"
          }

      - name: Test Rust workspace
        run: cargo test --workspace
