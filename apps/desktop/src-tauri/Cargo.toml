[package]
name = "moe-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "moe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
fontdb = "0.24.0"
moe-adapter-sdk = { path = "../../../crates/moe-adapter-sdk" }
moe-core = { path = "../../../crates/moe-core" }
moe-credential-store = { path = "../../../crates/moe-credential-store" }
moe-mcp = { path = "../../../crates/moe-mcp" }
moe-relay-client = { path = "../../../crates/moe-relay-client" }
moe-relay-transport = { path = "../../../crates/moe-relay-transport" }
moe-protocol = { path = "../../../crates/moe-protocol" }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1", features = ["net", "rt", "sync"] }
tokio-util = "0.7"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
moe-relay-transport = { path = "../../../crates/moe-relay-transport", features = ["test-root-certificate"] }
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tower = { version = "0.5", features = ["util"] }
